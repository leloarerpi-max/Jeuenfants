<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>Doigts magiques</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
    background: linear-gradient(180deg, #bde7ff 0%, #e8f8ff 60%, #d9f5c5 100%);
    color: #333;
  }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  #menu { justify-content: center; gap: 3vh; padding: 2vh 3vw; }
  #menu h1 { margin: 0; font-size: clamp(32px, 6vw, 64px); color: #ff6f00; text-shadow: 3px 3px 0 #fff; text-align: center; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2.5vmin; width: min(900px, 94vw); }
  .menu-btn {
    border: none; border-radius: 28px; padding: 3vh 1vw; cursor: pointer;
    font-family: inherit; font-size: clamp(22px, 3.2vw, 34px); color: #fff; font-weight: bold;
    box-shadow: 0 8px 0 rgba(0,0,0,.2); transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column; align-items: center; gap: 1vh;
  }
  .menu-btn .ico { font-size: clamp(50px, 8vw, 90px); line-height: 1; }
  .menu-btn:hover { transform: scale(1.08) rotate(-2deg); box-shadow: 0 12px 0 rgba(0,0,0,.2), 0 0 30px rgba(255,255,255,.9); }
  .menu-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }

  /* ---------- Barre du haut ---------- */
  .topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1.5vh 2vw; }
  .round-btn {
    width: clamp(60px, 9vmin, 90px); height: clamp(60px, 9vmin, 90px); border-radius: 50%; border: none; cursor: pointer;
    font-size: clamp(30px, 5vmin, 48px); background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.2); transition: transform .15s;
  }
  .round-btn:hover { transform: scale(1.15); box-shadow: 0 5px 0 rgba(0,0,0,.2), 0 0 25px #ffeb3b; }
  .stars { font-size: clamp(28px, 5vmin, 48px); letter-spacing: 4px; }

  /* ---------- Questions ---------- */
  #prompt { display: flex; align-items: center; gap: 2vw; margin-top: 1vh; padding: 0 2vw; text-align: center; }
  #promptText { font-size: clamp(28px, 5vw, 56px); font-weight: bold; color: #e65100; text-shadow: 2px 2px 0 #fff; }
  #promptVisual { font-size: clamp(36px, 7vw, 70px); min-height: 1.2em; text-align: center; padding: 0 3vw; }
  #choices { flex: 1; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4vmin; padding: 2vh 3vw 6vh; }
  .card {
    width: clamp(150px, 26vmin, 260px); height: clamp(150px, 26vmin, 260px);
    background: #fff; border: 8px solid #fff; border-radius: 32px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 0 rgba(0,0,0,.18); transition: transform .15s, box-shadow .15s, border-color .15s;
    font-size: clamp(80px, 15vmin, 150px); font-weight: bold; padding: 0; font-family: inherit;
  }
  .card svg { width: 80%; height: 80%; }
  .card:hover { transform: scale(1.12); border-color: #ffca28; box-shadow: 0 12px 0 rgba(0,0,0,.18), 0 0 35px #ffe082; }
  .card:active { transform: scale(0.96); }
  .card.good { animation: jump .7s ease; border-color: #66bb6a; background: #e8f5e9; }
  .card.bad { animation: shake .45s ease; border-color: #ef9a9a; }
  @keyframes jump { 0%,100% { transform: translateY(0) scale(1.1);} 30% { transform: translateY(-40px) scale(1.25);} 60% { transform: translateY(0) scale(1.1);} 80% { transform: translateY(-15px) scale(1.15);} }
  @keyframes shake { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-18px);} 40% { transform: translateX(18px);} 60% { transform: translateX(-12px);} 80% { transform: translateX(12px);} }

  /* ---------- Bulles (souris magique) ---------- */
  #stage { position: relative; flex: 1; width: 100%; }
  .bubble {
    position: absolute; width: clamp(90px, 15vmin, 150px); height: clamp(90px, 15vmin, 150px); border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95) 0 12%, var(--c) 35%, var(--c) 100%);
    box-shadow: inset -8px -8px 18px rgba(0,0,0,.15), 0 4px 12px rgba(0,0,0,.15);
    animation: bob var(--d) ease-in-out infinite alternate; transition: transform .1s;
  }
  .bubble:hover { transform: scale(1.12); }
  .bubble.pop { animation: pop .35s ease-out forwards; pointer-events: none; }
  @keyframes bob { from { transform: translateY(-14px) translateX(-8px);} to { transform: translateY(14px) translateX(8px);} }
  @keyframes pop { 0% { transform: scale(1); opacity: 1;} 60% { transform: scale(1.6); opacity: .8;} 100% { transform: scale(2.2); opacity: 0;} }

  /* ---------- Fin de partie ---------- */
  #end { justify-content: center; gap: 4vh; text-align: center; }
  #end h2 { font-size: clamp(40px, 8vw, 90px); margin: 0; color: #ff6f00; text-shadow: 3px 3px 0 #fff; }
  #end .big { font-size: clamp(60px, 12vw, 130px); }
  .end-btns { display: flex; gap: 4vw; }

  .confetti { position: fixed; top: -30px; width: 16px; height: 22px; z-index: 99; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* ---------- Menu élargi ---------- */
  #menu { justify-content: flex-start; overflow-y: auto; gap: 2vh; padding: 3vh 3vw 6vh; }
  #menu h1 { font-size: clamp(28px, 5vw, 52px); }
  .menu-btn { padding: 1.6vh 1vw; font-size: clamp(16px, 2.2vw, 24px); border-radius: 24px; }
  .menu-btn .ico { font-size: clamp(38px, 5.5vw, 62px); }
  .menu-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); width: min(1000px, 94vw); }
  .menu-section { display: flex; flex-direction: column; align-items: center; gap: 1.5vh; width: 100%; }
  .menu-sub { margin: 0; font-size: clamp(20px, 3vw, 32px); color: #37474f; text-shadow: 1px 1px 0 #fff; }

  /* ---------- Mini-jeux ---------- */
  #field { position: relative; flex: 1; width: 100%; }
  .target { position: absolute; background: none; border: none; cursor: pointer; padding: 0; line-height: 1;
    font-size: clamp(70px, 14vmin, 130px); transition: transform .25s, opacity .3s; }
  .target:hover { transform: scale(1.3); filter: drop-shadow(0 0 18px #ffe082); }
  .bigtarget { background: none; border: none; cursor: pointer; padding: 0; line-height: 1;
    font-size: clamp(120px, 28vmin, 260px); transition: transform .15s; }
  .bigtarget:hover { transform: scale(1.1); filter: drop-shadow(0 0 25px #ffe082); }
  .dots { font-size: clamp(30px, 6vmin, 56px); letter-spacing: 8px; }
  .palette { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px;
    z-index: 5; background: rgba(255,255,255,.88); padding: 10px 16px; border-radius: 40px;
    box-shadow: 0 4px 0 rgba(0,0,0,.15); flex-wrap: wrap; justify-content: center; }
  .swatch { width: clamp(44px, 7vmin, 64px); height: clamp(44px, 7vmin, 64px); border-radius: 50%; border: 5px solid #fff;
    cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25); font-size: 26px; padding: 0; background: #fff; transition: transform .15s; }
  .swatch:hover { transform: scale(1.2); }
  .dropbox { width: 24vmin; height: 24vmin; border: 8px dashed; border-radius: 24px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center; gap: 4px; }
  .ball { position: absolute; border-radius: 50%; cursor: grab; z-index: 5; touch-action: none;
    box-shadow: inset -8px -8px 14px rgba(0,0,0,.2), 0 5px 8px rgba(0,0,0,.2); }
  .ball:hover { box-shadow: inset -8px -8px 14px rgba(0,0,0,.2), 0 0 28px #ffe082; }
  .ball.dragging { cursor: grabbing; z-index: 10; transform: scale(1.1); }
  .ball.back { transition: left .3s, top .3s; }
  .mini { width: 26%; height: 26%; border-radius: 50%; }

  /* ---------- Jeux d'éveil (ajouts) ---------- */
  #field { touch-action: none; }
  #promptVisual { font-size: clamp(40px, 9vw, 80px); }
  @media (max-height: 520px) { #promptText2 { font-size: 20px !important; } #promptVisual { font-size: 36px; } }
  .ball.itm { background: #fff; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .pz { position: absolute; z-index: 5; border-radius: 8px; overflow: hidden; box-shadow: 0 5px 10px rgba(0,0,0,.3);
    cursor: grab; touch-action: none; border: 3px solid #fff; background: #fff; }
  .pz.dragging { cursor: grabbing; z-index: 10; transform: scale(1.06); }
  .pz.back { transition: left .3s, top .3s; }
  .slot { position: absolute; border: 3px dashed #90a4ae; background: rgba(255,255,255,.5); overflow: hidden; }
  .slot svg { opacity: .22; }
  .cp { position: absolute; display: flex; align-items: center; justify-content: center; line-height: 1; pointer-events: none; transition: opacity .2s; }
  .cp.dim { opacity: .45; }
  .cp.next { animation: pulse .7s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }
  .key { flex: 1; min-width: 0; border: none; border-radius: 0 0 22px 22px; cursor: pointer; color: #fff; font-family: inherit; font-weight: bold;
    font-size: clamp(16px, 3vw, 32px); display: flex; align-items: flex-end; justify-content: center; padding: 0 0 14px;
    box-shadow: 0 8px 0 rgba(0,0,0,.22); transition: transform .08s, box-shadow .08s; touch-action: none; }
  .key.down { transform: translateY(8px); box-shadow: 0 0 0 rgba(0,0,0,.22); filter: brightness(1.2); }
  .bigitem { background: none; border: none; cursor: pointer; padding: 4px; line-height: 1;
    font-size: clamp(52px, 11vmin, 96px); transition: transform .15s, opacity .2s; }
  .bigitem:hover { transform: scale(1.2); }
  .bigitem.gone { opacity: 0; pointer-events: none; transform: scale(.3); }
  .basket { min-width: 44vmin; min-height: 20vmin; border: 8px solid #a1887f; border-radius: 10px 10px 40px 40px; background: #ffe0b2;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px; padding: 6px; }
  .basket .ph { font-size: 12vmin; opacity: .35; }
  .basket .in { font-size: clamp(24px, 5vmin, 48px); line-height: 1; }

  /* ---------- Bulles numérotées ---------- */
  .bubble { display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff;
    font-size: clamp(34px, 7vmin, 62px); text-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .bubble.next { animation: bob var(--d) ease-in-out infinite alternate, glow 1s ease-out infinite; }
  .bubble.nope { animation: shake .4s; }
  @keyframes glow {
    from { box-shadow: inset -8px -8px 18px rgba(0,0,0,.15), 0 0 0 0 rgba(255,235,59,.95); }
    to   { box-shadow: inset -8px -8px 18px rgba(0,0,0,.15), 0 0 0 22px rgba(255,235,59,0); }
  }

  /* ---------- Profil : prénom, album, niveaux ---------- */
  .profile-bar { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; }
  .pill { border: none; border-radius: 999px; padding: 10px 22px; font: inherit; font-weight: bold;
    font-size: clamp(18px, 2.6vw, 28px); color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #albumBtn { background: #ff8f00; }
  #nameBtn { background: #26a69a; }
  .pill:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .menu-btn { position: relative; }
  .menu-btn .lvl { position: absolute; top: 6px; right: 8px; font-size: clamp(12px, 1.6vw, 18px); line-height: 1;
    background: rgba(255,255,255,.9); border-radius: 999px; padding: 3px 6px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal[hidden] { display: none; }
  .modal-box { background: #fff; border-radius: 28px; padding: 24px; width: min(460px, 92vw); display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .modal-box h3 { margin: 0; font-size: clamp(22px, 4vw, 32px); color: #e65100; }
  #nameInput { font: inherit; font-size: clamp(26px, 5vw, 40px); width: 100%; padding: 10px 14px; border: 4px solid #ffcc80;
    border-radius: 18px; text-align: center; -webkit-user-select: text; user-select: text; }
  .modal-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #voiceBtn { background: #7e57c2; }
  .voice-box { max-height: 92vh; overflow-y: auto; gap: 12px; width: min(560px, 94vw); }
  .vsec { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .vlabel { font-weight: bold; color: #37474f; font-size: clamp(16px, 2.4vw, 22px); }
  .vrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .vopt { border: 3px solid #d1c4e9; background: #f3e5f5; border-radius: 16px; padding: 8px 14px; font: inherit; font-weight: bold;
    font-size: clamp(15px, 2.2vw, 20px); color: #4a148c; cursor: pointer; }
  .vopt.on { background: #7e57c2; border-color: #7e57c2; color: #fff; }
  .vhint { font-size: clamp(13px, 1.8vw, 16px); color: #607d8b; }
  @media (max-height: 520px) {
    .voice-box { padding: 12px 16px; gap: 6px; }
    .voice-box h3 { font-size: 20px; }
    .vopt { padding: 5px 10px; font-size: 15px; }
  }
  .modal-btns .pill { background: #66bb6a; }
  .modal-btns .pill.secondary { background: #90a4ae; }
  #album { justify-content: flex-start; overflow-y: auto; }
  #albumTitle { font-size: clamp(22px, 4vw, 40px); font-weight: bold; color: #e65100; text-shadow: 2px 2px 0 #fff; text-align: center; }
  .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(64px, 11vmin, 110px), 1fr)); gap: 2vmin;
    width: min(900px, 94vw); padding: 2vh 0 6vh; }
  .stk { aspect-ratio: 1; background: #fff; border-radius: 22px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(38px, 7vmin, 70px); box-shadow: 0 5px 0 rgba(0,0,0,.15); cursor: pointer; border: none; padding: 0; font-family: inherit; }
  .stk.empty { background: rgba(255,255,255,.45); color: rgba(0,0,0,.18); font-weight: bold; cursor: default; box-shadow: none; }
  .stk.wiggle { animation: wig .5s; }
  @keyframes wig { 25% { transform: rotate(-12deg) scale(1.15); } 75% { transform: rotate(12deg) scale(1.15); } }
  #reward { display: flex; flex-direction: column; align-items: center; gap: 1vh; }
  .rw-label { font-size: clamp(20px, 3.5vw, 34px); font-weight: bold; color: #37474f; }
  .rw-sticker { font-size: clamp(60px, 11vmin, 110px); line-height: 1; animation: popin .8s; }
  .rw-level { font-size: clamp(18px, 3vw, 30px); font-weight: bold; color: #2e7d32; background: #fff; border-radius: 999px; padding: 6px 18px; }
  @keyframes popin { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.3) rotate(8deg); } 100% { transform: scale(1); } }
  @media (max-height: 520px) {
    #end { gap: 2vh; }
    #end .big { display: none; }
    #end h2 { font-size: 40px; }
    .rw-sticker { font-size: 60px; }
    .end-btns .round-btn { width: 80px !important; height: 80px !important; font-size: 44px !important; }
  }
  /* ---------- Nouveaux jeux ---------- */
  .addvis { display: flex; align-items: center; justify-content: center; gap: 2vw; flex-wrap: wrap; }
  .addgrp { display: inline-flex; flex-wrap: wrap; justify-content: center; max-width: 34vw; font-size: .62em; line-height: 1.05;
    background: rgba(255,255,255,.7); border-radius: 18px; padding: 4px 8px; }
  .addvis b { color: #e65100; }
  .maze { position: absolute; background: #fffde7; border: 6px solid #5d4037; border-radius: 10px; box-sizing: content-box; }
  .mz { position: absolute; box-sizing: border-box; }
  .mz.trail { background: #ffe082; }
  .mz-tok { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: none; line-height: 1; transition: left .08s, top .08s; }
  .word-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 1vh 2vw; }
  .word-pic { font-size: clamp(50px, 12vmin, 110px); line-height: 1; }
  .slots { display: flex; gap: 1.2vmin; justify-content: center; }
  .wslot { background: #fff; border-radius: 14px; border: 4px dashed #ffb74d; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: rgba(0,0,0,.15); }
  .wslot.filled { border-style: solid; border-color: #66bb6a; color: #2e7d32; }
  .tiles { display: flex; flex-wrap: wrap; gap: 1.6vmin; justify-content: center; max-width: 94vw; }
  .tile { border: none; border-radius: 16px; color: #fff; font: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.2); padding: 0; }
  .tile.used { visibility: hidden; }
  .tile.bad { animation: shake .4s; }

  /* ---------- Version tactile (iPad / téléphone) ---------- */
  html, body { touch-action: manipulation; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage, .bubble { touch-action: none; }
  @media (hover: none) {
    .card:hover { transform: none; border-color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
    .card.good, .card.good:hover { border-color: #66bb6a; }
    .card.bad, .card.bad:hover { border-color: #ef9a9a; }
    .menu-btn:hover { transform: none; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
    .round-btn:hover { transform: none; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
    .target:hover, .bigtarget:hover, .bigitem:hover { transform: none; filter: none; }
    .swatch:hover, .bubble:hover { transform: none; }
    .ball:hover { box-shadow: inset -8px -8px 14px rgba(0,0,0,.2), 0 5px 8px rgba(0,0,0,.2); }
  }
  @media (max-height: 520px) {
    .card { width: 30vh; height: 30vh; border-width: 5px; border-radius: 20px; font-size: 16vh; }
    .round-btn { width: 48px; height: 48px; font-size: 24px; }
    .topbar { padding: 6px 2vw; }
    .stars { font-size: 24px; }
    #promptText, #promptText3 { font-size: 24px !important; }
    #promptVisual { font-size: 36px; min-height: 1em; }
    #choices { gap: 3vh; padding: 1vh 3vw 3vh; }
    .menu-btn .ico { font-size: 40px; }
    #menu h1 { font-size: 26px; }
    .dropbox { width: 28vh; height: 28vh; }
    .bigtarget { font-size: 30vh; }
  }
</style>
</head>
<body>

<!-- MENU -->
<div id="menu" class="screen active">
  <h1>👆 Le jeu des doigts magiques</h1>
  <div class="profile-bar">
    <button class="pill" id="albumBtn">📒 Mon album <span id="albumCount"></span></button>
    <button class="pill" id="nameBtn">✏️ <span id="nameLabel">Ton prénom ?</span></button>
    <button class="pill" id="voiceBtn">🔊 Voix</button>
  </div>
  <div class="menu-section">
    <h2 class="menu-sub">👆 Je m'entraîne avec le doigt</h2>
    <div class="menu-grid">
      <button class="menu-btn" style="background:#29b6f6" data-mode="bubbles"><span class="ico">🫧</span>Bulles</button>
      <button class="menu-btn" style="background:#ff7043" data-mode="catch"><span class="ico">🎯</span>Attrape</button>
      <button class="menu-btn" style="background:#8d6e63" data-mode="draw"><span class="ico">🖍️</span>Dessin</button>
      <button class="menu-btn" style="background:#26a69a" data-mode="drag"><span class="ico">🧺</span>Rangement</button>
      <button class="menu-btn" style="background:#5c6bc0" data-mode="memory"><span class="ico">🃏</span>Mémoire</button>
      <button class="menu-btn" style="background:#ec407a" data-mode="clicks"><span class="ico">👆</span>Compte-touches</button>
      <button class="menu-btn" style="background:#fb8c00" data-mode="path"><span class="ico">🥕</span>Chemin</button>
      <button class="menu-btn" style="background:#3f51b5" data-mode="puzzle"><span class="ico">🧩</span>Puzzle</button>
      <button class="menu-btn" style="background:#00897b" data-mode="sort"><span class="ico">🗂️</span>Tri</button>
      <button class="menu-btn" style="background:#d81b60" data-mode="basket"><span class="ico">🛒</span>Panier</button>
      <button class="menu-btn" style="background:#6d4c41" data-mode="piano"><span class="ico">🎹</span>Piano</button>
      <button class="menu-btn" style="background:#8e24aa" data-mode="melody"><span class="ico">🎼</span>Mélodie</button>
      <button class="menu-btn" style="background:#00838f" data-mode="maze"><span class="ico">🐭</span>Labyrinthe</button>
      <button class="menu-btn" style="background:#c0ca33" data-mode="word"><span class="ico">✏️</span>J'écris</button>
    </div>
  </div>
  <div class="menu-section">
    <h2 class="menu-sub">🧠 J'apprends</h2>
    <div class="menu-grid">
      <button class="menu-btn" style="background:#ab47bc" data-mode="shapes"><span class="ico">⭐</span>Formes</button>
      <button class="menu-btn" style="background:#ef5350" data-mode="colors"><span class="ico">🎨</span>Couleurs</button>
      <button class="menu-btn" style="background:#66bb6a" data-mode="numbers"><span class="ico">🔢</span>Chiffres</button>
      <button class="menu-btn" style="background:#ffa726" data-mode="animals"><span class="ico">🐶</span>Animaux</button>

<script>
/* ================== Outils : voix, sons, confettis ================== */
let audioCtx = null;
function ctx() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur = 0.15, type = "sine", delay = 0, vol = 0.15) {
  const c = ctx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  const t = c.currentTime + delay;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sound = {
  hover: () => tone(660, 0.06, "sine", 0, 0.05),
  win:   () => { tone(523, 0.15, "triangle"); tone(659, 0.15, "triangle", 0.12); tone(784, 0.3, "triangle", 0.24); },
  oops:  () => { tone(300, 0.2, "sine", 0, 0.1); tone(240, 0.25, "sine", 0.15, 0.1); },
  pop:   () => { tone(500 + Math.random() * 400, 0.1, "square", 0, 0.08); },
  fanfare: () => { [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.2,"triangle",i*0.14)); }
};

/* Voix : réglages gardés sur l'appareil (voix, hauteur, vitesse, marche/arrêt) */
const VOICE_KEY = "jeuMagique_voix";
const PITCHES = { grave: 0.8, normale: 1.15, aigue: 1.5 };
const RATES = { lente: 0.7, normale: 0.85, rapide: 1.05 };
let VOICE = { name: "", pitch: "normale", rate: "normale", on: true };
try { const raw = localStorage.getItem(VOICE_KEY); if (raw) VOICE = Object.assign(VOICE, JSON.parse(raw)); } catch (e) {}
if (!(VOICE.pitch in PITCHES)) VOICE.pitch = "normale";
if (!(VOICE.rate in RATES)) VOICE.rate = "normale";
function saveVoice() { try { localStorage.setItem(VOICE_KEY, JSON.stringify(VOICE)); } catch (e) {} }
let frVoices = [], frVoice = null;
function loadVoice() {
  if (!("speechSynthesis" in window)) return;
  let vs = [];
  try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
  frVoices = vs.filter(v => /^fr/i.test(v.lang))
    .sort((a, b) => (/^fr[-_]FR/i.test(b.lang) ? 1 : 0) - (/^fr[-_]FR/i.test(a.lang) ? 1 : 0));
  frVoice = frVoices.find(v => v.name === VOICE.name) || frVoices[0] || null;
  const vm = document.getElementById("voiceModal");
  if (vm && !vm.hidden) renderVoiceList();
}
if ("speechSynthesis" in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text) {
  if (!("speechSynthesis" in window) || !VOICE.on) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = frVoice ? frVoice.lang : "fr-FR";
  u.rate = RATES[VOICE.rate]; u.pitch = PITCHES[VOICE.pitch];
  if (frVoice) u.voice = frVoice;
  speechSynthesis.speak(u);
}

function confetti(n = 60) {
  const cols = ["#ef5350","#ffca28","#66bb6a","#29b6f6","#ab47bc","#ff7043"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = cols[Math.floor(Math.random() * cols.length)];
    d.style.animationDuration = (1.8 + Math.random() * 1.8) + "s";
    d.style.animationDelay = Math.random() * 0.4 + "s";
    d.style.borderRadius = Math.random() > .5 ? "50%" : "3px";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4500);
  }
}

/* ================== Données ================== */

/* ================== Utilitaires ================== */
const $ = id => document.getElementById(id);

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const ROUNDS = 5;
let mode = null, score = 0, current = null, locked = false, lastTargetIdx = -1;

/* ================== Profil : prénom, autocollants, niveaux ================== */
const STORE_KEY = "jeuMagique_v1";
let PROFILE = { name: "", stickers: [], wins: {} };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) PROFILE = Object.assign(PROFILE, JSON.parse(raw)); } catch (e) {}
if (!Array.isArray(PROFILE.stickers)) PROFILE.stickers = [];
if (!PROFILE.wins || typeof PROFILE.wins !== "object") PROFILE.wins = {};
if (typeof PROFILE.name !== "string") PROFILE.name = "";
function saveProfile() { try { localStorage.setItem(STORE_KEY, JSON.stringify(PROFILE)); } catch (e) {} }
const nm = () => PROFILE.name ? " " + PROFILE.name : "";
function levelOf(m) { const w = PROFILE.wins[m] || 0; return w >= 4 ? 3 : w >= 2 ? 2 : 1; }
let BOOST = 0;
const lv = () => score + BOOST;
const FREE_PLAY = ["bubbles", "draw", "piano"];
const STICKERS = [

  { e: "🦓", n: "le zèbre" }, { e: "🐼", n: "le panda" }, { e: "🐨", n: "le koala" }, { e: "🦊", n: "le renard" },
  { e: "🐻", n: "l'ours" }, { e: "🐰", n: "le lapin" }, { e: "🦉", n: "la chouette" }, { e: "🐧", n: "le manchot" },
  { e: "🐬", n: "le dauphin" }, { e: "🐳", n: "la baleine" }, { e: "🐙", n: "la pieuvre" }, { e: "🦀", n: "le crabe" },
  { e: "🐢", n: "la tortue" }, { e: "🦋", n: "le papillon" }, { e: "🐞", n: "la coccinelle" }, { e: "🐝", n: "l'abeille" },
  { e: "🦖", n: "le dinosaure" }, { e: "🦕", n: "le diplodocus" }, { e: "🐉", n: "le dragon" }, { e: "🦄", n: "la licorne" },
  { e: "🚀", n: "la fusée" }, { e: "🛸", n: "la soucoupe volante" }, { e: "🌈", n: "l'arc-en-ciel" }, { e: "🌙", n: "la lune" },
  { e: "☀️", n: "le soleil" }, { e: "🪐", n: "la planète" }, { e: "🚒", n: "le camion de pompiers" }, { e: "🚜", n: "le tracteur" },
  { e: "🚂", n: "le train" }, { e: "✈️", n: "l'avion" }, { e: "⛵", n: "le bateau" }, { e: "🏰", n: "le château" },
  { e: "🎈", n: "le ballon" }, { e: "🍦", n: "la glace" }, { e: "🍰", n: "le gâteau" }, { e: "🎸", n: "la guitare" },
  { e: "🥁", n: "le tambour" }, { e: "👑", n: "la couronne" }, { e: "🦜", n: "le perroquet" }, { e: "🐸", n: "la grenouille" },
  { e: "🦔", n: "le hérisson" }, { e: "🐿️", n: "l'écureuil" }, { e: "🦩", n: "le flamant rose" }, { e: "🐠", n: "le poisson clown" }
];
function renderMenuInfo() {
  $("albumCount").textContent = `${PROFILE.stickers.length}/${STICKERS.length}`;
  $("nameLabel").textContent = PROFILE.name || "Ton prénom ?";
  document.querySelectorAll(".menu-btn").forEach(b => {
    const m = b.dataset.mode;

    if (FREE_PLAY.includes(m) || !PROFILE.wins[m]) { if (badge) badge.remove(); return; }
    if (!badge) { badge = document.createElement("span"); badge.className = "lvl"; b.appendChild(badge); }

}
function openAlbum() {
  ctx();
  const g = $("albumGrid"); g.innerHTML = "";
  STICKERS.forEach((st, i) => {
    const b = document.createElement("button");
    if (PROFILE.stickers.includes(i)) {
      b.className = "stk"; b.textContent = st.e;
      b.addEventListener("click", () => { b.classList.remove("wiggle"); void b.offsetWidth; b.classList.add("wiggle"); tone(600, 0.12, "triangle"); say(st.n); });
    } else { b.className = "stk empty"; b.textContent = "?"; }
    g.appendChild(b);
  });
  const n = PROFILE.stickers.length;
  $("albumTitle").textContent = `📒 Mon album : ${n} / ${STICKERS.length}`;
  show("album");
  say(n === 0 ? "Ton album est vide. Gagne des parties pour avoir des autocollants !"
    : `Tu as ${n} autocollant${n > 1 ? "s" : ""}${nm()} ! Touche-les pour entendre leur nom.`);
}
function cleanName(v) {
  v = (v || "").replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' -]/g, "").replace(/\s+/g, " ").trim().slice(0, 12);
  return v ? v.charAt(0).toUpperCase() + v.slice(1) : "";
}
function renderVoiceList() {
  const box = $("voiceList"); box.innerHTML = "";
  frVoices.forEach(v => {
    const b = document.createElement("button");
    b.className = "vopt" + (frVoice && v.name === frVoice.name ? " on" : "");
    b.textContent = v.name.replace(/\s*\(.*\)\s*$/, "").replace(/^(Microsoft|Google)\s+/, "") + (/CA/i.test(v.lang) ? " 🇨🇦" : /BE/i.test(v.lang) ? " 🇧🇪" : /CH/i.test(v.lang) ? " 🇨🇭" : "");
    b.addEventListener("click", () => { VOICE.name = v.name; frVoice = v; saveVoice(); renderVoiceList(); voiceDemo(); });
    box.appendChild(b);
  });
  $("voiceHint").textContent = frVoices.length > 1 ? "Touche une voix pour l'écouter."
    : frVoices.length === 1 ? "Une seule voix française sur cet appareil. Sur iPad : Réglages › Accessibilité › Contenu énoncé › Voix › Français pour en ajouter."
    : "Aucune voix française trouvée. Sur iPad : Réglages › Accessibilité › Contenu énoncé › Voix › Français.";
  document.querySelectorAll("[data-pitch]").forEach(b => b.classList.toggle("on", b.dataset.pitch === VOICE.pitch));
  document.querySelectorAll("[data-rate]").forEach(b => b.classList.toggle("on", b.dataset.rate === VOICE.rate));
  $("voiceToggle").textContent = VOICE.on ? "🔊 Voix activée" : "🔇 Voix coupée";
  $("voiceToggle").classList.toggle("on", VOICE.on);
}
function voiceDemo() { say("Bonjour" + nm() + " ! C'est moi, la voix du jeu."); }
function openVoice() { ctx(); loadVoice(); renderVoiceList(); $("voiceModal").hidden = false; }

  if (save) {
    PROFILE.name = cleanName($("nameInput").value); saveProfile(); renderMenuInfo();
    if (PROFILE.name) say("Bonjour " + PROFILE.name + " !");
  }
  $("nameInput").blur(); $("nameModal").hidden = true;
}

/* ================== Navigation ================== */
document.querySelectorAll(".menu-btn").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
["homeBtn", "homeBtn2", "endHome", "homeBtn4"].forEach(id => $(id).addEventListener("click", goMenu));

$("voiceToggle").addEventListener("click", () => {
  VOICE.on = !VOICE.on; saveVoice(); renderVoiceList();
  if (VOICE.on) voiceDemo(); else if ("speechSynthesis" in window) speechSynthesis.cancel();
});
document.querySelectorAll("[data-pitch]").forEach(b => b.addEventListener("click", () => { VOICE.pitch = b.dataset.pitch; saveVoice(); renderVoiceList(); voiceDemo(); }));
document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => { VOICE.rate = b.dataset.rate; saveVoice(); renderVoiceList(); voiceDemo(); }));
$("nameOk").addEventListener("click", () => closeName(true));
$("nameCancel").addEventListener("click", () => closeName(false));
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") closeName(true); });
$("againBtn").addEventListener("click", () => start(mode));
$("speakBtn").addEventListener("click", () => current && say(current.speech));
$("speakBtn2").addEventListener("click", () => say("Touche les bulles avec ton doigt, dans l'ordre : 1, 2, 3 !"));
document.querySelectorAll(".menu-btn, .round-btn, .card").forEach(el => el.addEventListener("mouseenter", sound.hover));

function goMenu() { clearArena(); mode = null; if ("speechSynthesis" in window) speechSynthesis.cancel(); show("menu"); }

function start(m) {
  ctx();
  mode = m; score = 0; locked = false; lastTargetIdx = -1; clearArena();
  BOOST = (levelOf(m) - 1) * 2;
  if (m === "bubbles") { show("bubblesScreen"); spawnBubbles(); say("Touche les bulles avec ton doigt, dans l'ordre : 1, 2, 3 !"); }
  else if (ARENA[m]) { show("arena"); renderStars(); ARENA[m](); }
  else { show("game"); renderStars(); nextQuestion(); }
}

function renderStars() {
  const s = "⭐".repeat(score) + "☆".repeat(ROUNDS - score);
  $("stars").textContent = s; $("stars3").textContent = s;
}

/* ================== Bulles : survol uniquement ================== */
function spawnBubbles() {
  const stage = $("stage"); stage.innerHTML = "";
  const cols = ["#ef5350", "#42a5f5", "#ffca28", "#66bb6a", "#ab47bc", "#ff7043", "#26c6da", "#ec407a"];
  const portrait = window.innerHeight > window.innerWidth;
  const perRow = portrait ? 2 : 4, rows = portrait ? 4 : 2, N = 8;
  let next = 1;
  const all = [];
  shuffle([...Array(N).keys()]).forEach((cell, i) => {
    const num = i + 1;
    const b = document.createElement("div");
    b.className = "bubble"; b.textContent = num;
    const col = cell % perRow, row = Math.floor(cell / perRow);
    b.style.left = (col * (100 / perRow) + 100 / perRow / 2 - 7 + (Math.random() * 6 - 3)) + "%";
    b.style.top = (row * (100 / rows) + 4 + Math.random() * 6) + "%";
    b.style.setProperty("--c", cols[i % cols.length]);
    b.style.setProperty("--d", (1.8 + Math.random() * 1.6) + "s");
    b._pop = () => {
      if (b.classList.contains("pop")) return;
      if (num !== next) {
        if (b.classList.contains("nope")) return;
        b.classList.add("nope"); setTimeout(() => b.classList.remove("nope"), 400);
        return;
      }
      b.classList.remove("next"); b.classList.add("pop"); sound.pop(); next++;
      setTimeout(() => b.remove(), 400);
      if (next <= N) all[next - 1].classList.add("next");
      else {
        setTimeout(() => { sound.win(); confetti(); say("Bravo ! Tu sais compter jusqu'à huit !"); }, 350);
        setTimeout(() => { if ($("bubblesScreen").classList.contains("active")) spawnBubbles(); }, 4200);
      }
    };

  });

}

function pickThree(pool, keyFn) {
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); } while (idx === lastTargetIdx && pool.length > 1);
  lastTargetIdx = idx;
  const target = pool[idx];
  const others = shuffle(pool.filter((_, i) => i !== idx)).slice(0, lv() >= 2 ? 3 : 2);
  return { target, options: shuffle([target, ...others]) };
}

function buildColors() {
  const { target, options } = pickThree(COLORS);
  return {
    text: `Où est ${target.art} ?`,
    speech: `Où est ${target.art} ? Touche dessus !`,
    options: options.map(c => ({
      html: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="${c.hex}"/></svg>`,
      correct: c === target
    }))
  };
}

function buildShapes() {
  const { target, options } = pickThree(SHAPES);

    speech: `Où est ${target.art} ? Touche dessus !`,

function buildAnimals() {

    speech: `Où est ${target.art} ? Touche dessus !`,

function buildNumbers() {
  const max = Math.min(9, 5 + lv());
  const { target, options } = pickThree(Array.from({ length: max }, (_, i) => ({ n: i + 1 })));
  const palette = shuffle(["#e53935", "#1e88e5", "#43a047", "#fb8c00", "#8e24aa", "#00acc1"]);
  const cards = options.map((o, i) => ({
    html: `<span style="color:${palette[i]}">${o.n}</span>`,
    correct: o === target
  }));
  if (lv() >= 2 && Math.random() < 0.5) {
    return {
      text: `Où est le chiffre ${target.n} ?`,
      speech: `Où est le chiffre ${target.n} ? Touche dessus !`,

/* --- Mémoire : retrouver les paires (4 puis 6) --- */
ARENA.memory = function () {
  const f = $("field");
  const PAIRS = [4, 6];
  let round = 0;
  $("stars3").textContent = "☆☆";
  const play = () => {
    f.innerHTML = "";
    setArena("Retrouve les paires !", "Retrouve les deux images pareilles ! Touche les cartes.");
    const np = PAIRS[round], picks = shuffle(ANIMALS).slice(0, np), deck = shuffle([...picks, ...picks]);
    const W = f.clientWidth, H = f.clientHeight, gap = 12, n = deck.length;
    let best = 0, bc = 2;
    for (let c = 2; c <= 6; c++) {
      const r = Math.ceil(n / c);
      const s = Math.min((W - gap * (c + 1)) / c, (H - gap * (r + 1)) / r, 190);
      if (s > best) { best = s; bc = c; }
    }
    const s = Math.floor(best);
    const grid = document.createElement("div");
    grid.style.cssText = `display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:${gap}px;width:${bc * s + (bc - 1) * gap + 2}px;max-width:100%;height:100%;margin:0 auto;`;
    f.appendChild(grid);
    let first = null, busy = false, matched = 0;
    const hide = c => { c.textContent = "❓"; c.style.background = "#fff59d"; };
    deck.forEach(a => {
      const c = document.createElement("button");
      c.className = "card"; c.dataset.e = a.e;
      c.style.cssText += `width:${s}px;height:${s}px;font-size:${Math.round(s * 0.55)}px;border-width:5px;border-radius:20px;`;
      hide(c);
      c.addEventListener("mouseenter", sound.hover);
      c.addEventListener("click", () => {
        if (busy || c === first || c.classList.contains("good")) return;
        c.textContent = a.e; c.style.background = "#fff"; tone(880, 0.1);
        if (!first) { first = c; return; }
        if (first.dataset.e === c.dataset.e) {
          first.classList.add("good"); c.classList.add("good"); first = null; matched++;
          sound.win(); confetti(20);
          if (matched === np) {
            round++;
            $("stars3").textContent = "⭐".repeat(round) + "☆".repeat(2 - round);
            later(() => round >= 2 ? finish() : play(), 1300);
          }
        } else {
          busy = true; sound.oops();
          const f1 = first; first = null;
          later(() => { hide(f1); hide(c); busy = false; }, 1100);
        }
      });
      grid.appendChild(c);
    });
  };
  play();
};

/* ================== Jeux d'éveil : nouveaux quiz ================== */
function stripArt(s) { return s.replace(/^(le |la |l')/, ""); }

function buildPattern() {
  const sets = [["🔴", "🔵", "🟡", "🟢", "🟠", "🟣"], ["🐶", "🐱", "🐸", "🐰", "🐷"], ["⭐", "❤️", "🌙", "☀️"]];
  const [A, B, C, D] = shuffle(rand(sets));
  const hard = lv() >= 2;
  const kind = rand(hard ? ["ABB", "AABB", "ABC", "AAB"] : ["AB", "AAB", "ABC"]);
  let seq, answer;
  if (kind === "AB")   { seq = [A, B, A, B, A];       answer = B; }
  if (kind === "AAB")  { seq = [A, A, B, A, A];       answer = B; }
  if (kind === "ABC")  { seq = [A, B, C, A, B];       answer = C; }
  if (kind === "ABB")  { seq = [A, B, B, A, B];       answer = B; }
  if (kind === "AABB") { seq = [A, A, B, B, A, A, B]; answer = B; }
  const wrong = [A, B, C, D].filter(x => x !== answer).slice(0, hard ? 3 : 2);
  return {
    text: "Que vient ensuite ?",
    visual: seq.join(" ") + " ❓",
    speech: "Que vient ensuite ? Touche dessus !",
    options: shuffle([answer, ...wrong]).map(x => ({ html: x, correct: x === answer }))
  };
}

function buildCompare() {
  const thing = rand(NUM_THINGS), more = Math.random() > 0.5;
  const max = Math.min(9, 5 + lv());
  const a = 1 + Math.floor(Math.random() * max);
  let b; do { b = 1 + Math.floor(Math.random() * max); } while (b === a);
  const text = more ? "Où y en a-t-il le plus ?" : "Où y en a-t-il le moins ?";
  return {
    text, speech: text + " Touche dessus !",
    options: shuffle([a, b]).map(n => ({
      html: `<span style="display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 4px;font-size:.36em;line-height:1.1;padding:4px;max-width:100%">${Array(n).fill(`<span>${thing.e}</span>`).join("")}</span>`,
      correct: more ? n === Math.max(a, b) : n === Math.min(a, b)
    }))
  };
}

function buildShadow() {
  const pool = [...ANIMALS, ...FRUITS, ...VEHICLES];
  const { target, options } = pickThree(pool);
  return {
    text: "Où est son ombre ?",
    visual: target.e,
    speech: "Où est l'ombre de cette image ? Touche dessus !",
    options: options.map(a => ({
      html: `<span style="filter:brightness(0);opacity:.8">${a.e}</span>`,
      correct: a === target
    }))
  };
}

function buildMix() {
  const MIXES = [
    { a: "🔴", an: "le rouge", b: "🟡", bn: "le jaune", hex: "#fb8c00" },
    { a: "🔵", an: "le bleu",  b: "🟡", bn: "le jaune", hex: "#43a047" },
    { a: "🔴", an: "le rouge", b: "🔵", bn: "le bleu",  hex: "#8e24aa" }
  ];
  if (lv() >= 2) MIXES.push({ a: "⚪", an: "le blanc", b: "🔴", bn: "le rouge", hex: "#f06292" });
  const m = rand(MIXES);
  const others = shuffle(COLORS.filter(c => c.hex !== m.hex)).slice(0, lv() >= 2 ? 3 : 2).map(c => c.hex);
  return {
    text: "Quelle couleur obtient-on ?",
    visual: `${m.a} + ${m.b} = ❓`,
    speech: `Si on mélange ${m.an} et ${m.bn}, quelle couleur obtient-on ? Touche dessus !`,
    options: shuffle([m.hex, ...others]).map(h => ({
      html: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="${h}"/></svg>`,
      correct: h === m.hex
    }))
  };
}

function buildInitial() {
  const pool = [...ANIMALS, ...FRUITS, ...VEHICLES].filter(x => !x.art.includes(" de "));
  const t = rand(pool), name = stripArt(t.art);
  const flat = s => s[0].normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
  const letter = flat(name);
  const others = shuffle("ABCDEFGHILMOPRSTV".split("").filter(l => l !== letter)).slice(0, lv() >= 2 ? 3 : 2);
  const pal = shuffle(LETTER_COLORS);
  return {
    text: `Par quelle lettre commence « ${name} » ?`,
    visual: t.e,
    speech: `Par quelle lettre commence le mot ${name} ? Touche dessus !`,
    options: shuffle([letter, ...others]).map((l, i) => ({
      html: `<span style="color:${pal[i]}">${l}</span>`,
      correct: l === letter
    }))
  };
}

/* ================== Jeux d'éveil : outils ================== */
function makeDraggable(el, home, onDrop) {
  let sx, sy, ox, oy, dragging = false;
  el.addEventListener("pointerdown", e => {
    dragging = true; el.setPointerCapture(e.pointerId);
    el.classList.remove("back"); el.classList.add("dragging");
    sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop;
  });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    el.style.left = (ox + e.clientX - sx) + "px"; el.style.top = (oy + e.clientY - sy) + "px";
  });
  const end = e => {
    if (!dragging) return; dragging = false;
    el.classList.remove("dragging");
    const r = el.getBoundingClientRect();
    const ok = onDrop(r.left + r.width / 2, r.top + r.height / 2);
    if (!ok) { el.classList.add("back"); el.style.left = home.left + "px"; el.style.top = home.top + "px"; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* --- Chemin : passer sur les étoiles dans l'ordre jusqu'à la carotte --- */
ARENA.path = function () {
  const f = $("field");
  let round = 0;
  $("stars3").textContent = "☆☆☆";
  const play = (retry = 0) => {
    f.innerHTML = "";
    if (!retry) setArena("Suis le chemin jusqu'à la carotte !", "Suis le chemin jusqu'à la carotte ! Glisse ton doigt sur les étoiles dans l'ordre.");
    const W = f.clientWidth, H = f.clientHeight, portrait = H > W;
    const along = portrait ? H : W, across = portrait ? W : H;
    const n = 5 + round, m = 5 + round, flip = Math.random() < 0.5, pts = [];
    for (let i = 0; i < n; i++) {
      const high = (i % 2 === 0) !== flip;
      const u = along * (0.12 + 0.76 * i / (n - 1));
      const v = across * (high ? 0.22 + Math.random() * 0.12 : 0.66 + Math.random() * 0.12);
      pts.push(portrait ? [v, u] : [u, v]);
    }
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < n; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      const c1 = portrait ? [x0, (y0 + y1) / 2] : [(x0 + x1) / 2, y0];
      const c2 = portrait ? [x1, (y0 + y1) / 2] : [(x0 + x1) / 2, y1];
      d += ` C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${x1} ${y1}`;
    }
    const w = Math.max(60, Math.min(W, H) * 0.13);
    f.innerHTML = `<svg width="${W}" height="${H}" style="position:absolute;inset:0">
      <path d="${d}" fill="none" stroke="#ffe082" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/></svg>`;
    const pathEl = f.querySelector("path"), total = pathEl.getTotalLength();
    const size = Math.round(w * 0.85);
    const mk = (len, emoji) => {
      const p = pathEl.getPointAtLength(len);
      const el = document.createElement("div");
      el.className = "cp"; el.textContent = emoji;
      el.style.cssText = `left:${p.x - size / 2}px;top:${p.y - size / 2}px;width:${size}px;height:${size}px;font-size:${size * 0.8}px`;
      f.appendChild(el);
      return { el, x: p.x, y: p.y, r: size * 0.7 };
    };
    const lens = [...Array.from({ length: m }, (_, i) => total * (0.12 + 0.72 * i / (m - 1))), total].map(l => pathEl.getPointAtLength(l));
    const tight = lens.some((a, i) => lens.some((b, j) => j > i && Math.hypot(a.x - b.x, a.y - b.y) < size * 1.05));
    if (tight && retry < 25) return play(retry + 1);
    mk(0, "🐰");
    const cps = Array.from({ length: m }, (_, i) => mk(total * (0.12 + 0.72 * i / (m - 1)), "⭐")).concat([mk(total, "🥕")]);
    let idx = 0;
    const refresh = () => cps.forEach((c, i) => { c.el.classList.toggle("next", i === idx); c.el.classList.toggle("dim", i > idx); });
    refresh();
    const move = e => {
      if (idx >= cps.length) return;
      const r = f.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, c = cps[idx];
      if (Math.hypot(x - c.x, y - c.y) > c.r) return;
      c.el.classList.remove("next"); tone(500 + idx * 60, 0.15, "triangle");
      if (idx < cps.length - 1) c.el.textContent = "✅";
      idx++;
      if (idx === cps.length) {
        round++;
        $("stars3").textContent = "⭐".repeat(round) + "☆".repeat(3 - round);
        sound.win(); confetti(40);
        later(() => round >= 3 ? finish() : play(), 1500);
      } else refresh();
    };
    f.onpointermove = move; f.onpointerdown = move;
  };
  play();
};

/* --- Puzzle : glisser les morceaux (4, 4 puis 9) --- */
const PUZZLES = [
  '<rect width="200" height="200" fill="#b3e5fc"/><rect y="140" width="200" height="60" fill="#81c784"/><circle cx="160" cy="40" r="22" fill="#ffd54f"/><rect x="55" y="90" width="90" height="60" fill="#ef5350"/><polygon points="45,92 100,45 155,92" fill="#6d4c41"/><rect x="90" y="116" width="20" height="34" fill="#fff8e1"/><rect x="65" y="104" width="18" height="18" fill="#fff8e1"/><rect x="117" y="104" width="18" height="18" fill="#fff8e1"/>',
  '<rect width="200" height="200" fill="#4fc3f7"/><rect y="170" width="200" height="30" fill="#ffe082"/><ellipse cx="95" cy="100" rx="55" ry="34" fill="#ff7043"/><polygon points="145,100 188,66 188,134" fill="#ff7043"/><circle cx="72" cy="92" r="8" fill="#fff"/><circle cx="70" cy="92" r="4" fill="#333"/><circle cx="40" cy="50" r="7" fill="#e1f5fe"/><circle cx="55" cy="28" r="5" fill="#e1f5fe"/><circle cx="150" cy="40" r="6" fill="#e1f5fe"/>',
  '<rect width="200" height="200" fill="#e1f5fe"/><rect y="150" width="200" height="50" fill="#81c784"/><rect x="97" y="95" width="6" height="65" fill="#388e3c"/><circle cx="100" cy="54" r="18" fill="#f06292"/><circle cx="125" cy="72" r="18" fill="#f06292"/><circle cx="115" cy="102" r="18" fill="#f06292"/><circle cx="85" cy="102" r="18" fill="#f06292"/><circle cx="75" cy="72" r="18" fill="#f06292"/><circle cx="100" cy="80" r="14" fill="#fdd835"/><circle cx="30" cy="35" r="14" fill="#ffd54f"/>'
];
ARENA.puzzle = function () {
  const f = $("field");
  const scenes = shuffle(PUZZLES), GRIDS = [2, 2, 3];
  let round = 0;
  $("stars3").textContent = "☆☆☆";
  const play = () => {
    f.innerHTML = "";
    setArena("Reconstruis le puzzle !", "Reconstruis le puzzle ! Glisse chaque morceau à sa place.");
    const g = GRIDS[round], scene = scenes[round], cnt = g * g, gap = 10;
    const pieceSvg = i => `<svg viewBox="${(i % g) * 200 / g} ${Math.floor(i / g) * 200 / g} ${200 / g} ${200 / g}" width="100%" height="100%" preserveAspectRatio="none">${scene}</svg>`;
    const W = f.clientWidth, H = f.clientHeight, land = W > H * 1.15;
    const cell = Math.floor(land
      ? Math.min((W * 0.42 - (g - 1) * gap) / g, H * 0.9 / g)
      : Math.min((W - 24) / g, (H * 0.96 - 24 - (g - 1) * gap) / (2 * g)));
    const trayW = g * cell + (g - 1) * gap;
    const bx = land ? W * 0.06 : (W - g * cell) / 2, by = land ? (H - g * cell) / 2 : H * 0.02;
    const tx = land ? W * 0.54 : (W - trayW) / 2, ty = land ? (H - trayW) / 2 : by + g * cell + 24;
    const slotPos = i => ({ left: bx + (i % g) * cell, top: by + Math.floor(i / g) * cell });
    const slots = Array.from({ length: cnt }, (_, i) => {
      const s = document.createElement("div");
      s.className = "slot"; s.innerHTML = pieceSvg(i);
      const p = slotPos(i);
      s.style.cssText += `left:${p.left}px;top:${p.top}px;width:${cell}px;height:${cell}px;`;
      f.appendChild(s); return s;
    });
    let placed = 0;
    shuffle([...Array(cnt).keys()]).forEach((i, k) => {
      const home = { left: tx + (k % g) * (cell + gap), top: ty + Math.floor(k / g) * (cell + gap) };
      const p = document.createElement("div");
      p.className = "pz"; p.innerHTML = pieceSvg(i);
      p.style.cssText += `left:${home.left}px;top:${home.top}px;width:${cell}px;height:${cell}px;`;
      makeDraggable(p, home, (cx, cy) => {
        const q = slots[i].getBoundingClientRect();
        if (Math.abs(cx - (q.left + q.width / 2)) > cell * 0.6 || Math.abs(cy - (q.top + q.height / 2)) > cell * 0.6) { sound.oops(); return false; }
        const pos = slotPos(i);
        p.style.left = pos.left + "px"; p.style.top = pos.top + "px";
        p.style.pointerEvents = "none"; p.style.zIndex = 3; p.style.borderRadius = "0";
        tone(660, 0.12, "triangle"); placed++;
        if (placed === cnt) {
          round++;
          $("stars3").textContent = "⭐".repeat(round) + "☆".repeat(3 - round);
          later(() => { sound.win(); confetti(40); }, 250);
          later(() => round >= 3 ? finish() : play(), 1800);
        }
        return true;
      });
      f.appendChild(p);
    });
  };
  play();
};

/* --- Tri : ranger dans la bonne boîte (3 catégories, 6 images) --- */
const SORT_CATS = [
  { name: "les animaux", icon: "🐾", pool: ANIMALS },
  { name: "les fruits", icon: "🍎", pool: FRUITS },
  { name: "les véhicules", icon: "🚗", pool: VEHICLES }
];
ARENA.sort = function () {
  const f = $("field");
  const cats = shuffle(SORT_CATS);
  setArena("Range chaque image dans la bonne boîte !", `Range chaque image dans la bonne boîte : ${cats[0].name}, ${cats[1].name} ou ${cats[2].name} !`);
  const row = document.createElement("div");
  row.style.cssText = "position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:space-around;";
  const boxes = cats.map(cat => {
    const b = document.createElement("div");
    b.className = "dropbox";
    b.style.cssText = "width:28vmin;height:28vmin;border-color:#90a4ae;background:rgba(255,255,255,.6);";
    b.dataset.cat = cat.name;
    b.innerHTML = `<div style="width:100%;text-align:center;line-height:1.1"><div style="font-size:8vmin">${cat.icon}</div><div style="font-size:max(12px,3vmin);font-weight:bold;color:#546e7a">${cat.name}</div></div>`;
    row.appendChild(b); return b;
  });
  f.appendChild(row);
  const W = f.clientWidth, H = f.clientHeight;
  const picks = shuffle(cats.flatMap(cat => shuffle(cat.pool).slice(0, 2).map(x => ({ x, cat }))));
  const total = picks.length, portrait = H > W, perRow = portrait ? 3 : total;
  const size = Math.round(Math.min(110, W / (perRow + 1), H / (portrait ? 7 : 5)));
  let done = 0;
  $("stars3").textContent = "☆".repeat(total);
  picks.forEach((p, i) => {
    const it = document.createElement("div");
    it.className = "ball itm"; it.textContent = p.x.e;
    const left0 = (i % perRow + 0.5) / perRow * W - size / 2, top0 = H * 0.04 + Math.floor(i / perRow) * (size + H * 0.05) + Math.random() * H * 0.04;
    it.style.cssText += `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.6)}px;left:${left0}px;top:${top0}px;`;
    makeDraggable(it, { left: left0, top: top0 }, (cx, cy) => {
      const hit = boxes.find(b => { const q = b.getBoundingClientRect(); return cx > q.left && cx < q.right && cy > q.top && cy < q.bottom; });
      if (hit && hit.dataset.cat === p.cat.name) {
        it.remove();
        const m = document.createElement("span"); m.textContent = p.x.e; m.style.fontSize = "5vmin"; hit.appendChild(m);
        sound.win(); done++;
        $("stars3").textContent = "⭐".repeat(done) + "☆".repeat(total - done);
        if (done >= total) later(finish, 800);
        return true;
      }
      sound.oops(); if (hit) say("Essaie encore !");
      return false;
    });
    f.appendChild(it);
  });
};

      });
      shelf.appendChild(b); items.push(b);

    ok.addEventListener("click", () => {
      if (done) return;

    bottom.appendChild(basket); bottom.appendChild(ok);
    f.appendChild(shelf); f.appendChild(bottom);
  };

/* --- Mélodie : écouter puis rejouer (3, 3 puis 4 notes) --- */
let melodySeq = [];
ARENA.melody = function () {
  const f = $("field");
  const LENS = [3, 3, 4];
  let round = 0, accepting = false, pos = 0;
  $("stars3").textContent = "☆☆☆";
  const { row, keys } = makeKeys(5);
  f.appendChild(row);
  const flash = i => { tone(NOTES[i][1], 0.6, "triangle", 0, 0.22); keys[i].classList.add("down"); later(() => keys[i].classList.remove("down"), 350); };
  const playSeq = () => {
    accepting = false; pos = 0;
    setArena("Écoute la mélodie !", "Écoute bien la mélodie !");
    melodySeq.forEach((k, j) => later(() => flash(k), 1500 + j * 700));
    later(() => { accepting = true; $("promptText3").textContent = "À toi de jouer !"; say("À toi de jouer !"); }, 1500 + melodySeq.length * 700 + 100);
  };
  const newRound = () => {
    melodySeq = Array.from({ length: LENS[round] }, () => Math.floor(Math.random() * 5));
    playSeq();
  };
  keys.forEach((k, i) => k.addEventListener("pointerdown", () => {
    if (!accepting) { tone(NOTES[i][1], 0.4, "triangle", 0, 0.1); return; }
    flash(i);
    if (i === melodySeq[pos]) {
      pos++;
      if (pos === melodySeq.length) {
        accepting = false; round++;
        $("stars3").textContent = "⭐".repeat(round) + "☆".repeat(3 - round);
        later(() => { sound.win(); confetti(30); say("Bravo !"); }, 700);
        later(() => round >= 3 ? finish() : newRound(), 2200);
      }
    } else {
      accepting = false; sound.oops(); say("Essaie encore !");
      later(playSeq, 1500);
    }
  }));
  newRound();
};

function finish() {
  if (!mode) return;
  const before = levelOf(mode);
  PROFILE.wins[mode] = (PROFILE.wins[mode] || 0) + 1;
  const after = levelOf(mode), up = after > before;
  const missing = STICKERS.map((_, i) => i).filter(i => !PROFILE.stickers.includes(i));
  const got = missing.length ? rand(missing) : null;
  if (got !== null) PROFILE.stickers.push(got);
  saveProfile(); renderMenuInfo();
  $("endTitle").textContent = "Bravo" + nm() + " !";
  let html = got !== null
    ? `<div class="rw-label">Nouvel autocollant !</div><div class="rw-sticker">${STICKERS[got].e}</div>`
    : `<div class="rw-label">Tu as tous les autocollants !</div>`;
  if (up) html += `<div class="rw-level">🔓 Niveau ${after} débloqué !</div>`;
  $("reward").innerHTML = html;
  show("end"); sound.fanfare(); confetti(120);
  let sp = "Bravo" + nm() + " ! Tu as gagné toutes les étoiles !";
  if (got !== null) sp += " Tu gagnes un autocollant : " + STICKERS[got].n + " !";
  if (up) sp += " Et tu passes au niveau " + after + " !";
  say(sp);
}

/* ================== Nouveaux jeux 4-5 ans ================== */
function buildAdd() {
  const thing = rand(NUM_THINGS);
  const maxSum = Math.min(10, 4 + lv());
  const sum = 2 + Math.floor(Math.random() * (maxSum - 1));
  const a = 1 + Math.floor(Math.random() * (sum - 1)), b = sum - a;
  const opts = new Set([sum]);
  const want = lv() >= 2 ? 4 : 3;
  while (opts.size < want) { const v = sum + rand([-3, -2, -1, 1, 2, 3]); if (v >= 1 && v <= 10) opts.add(v); }
  const pal = shuffle(LETTER_COLORS);
  const grp = n => `<span class="addgrp">${Array(n).fill(thing.e).join("")}</span>`;
  return {
    text: "Combien ça fait en tout ?",
    visualHTML: `<span class="addvis">${grp(a)}<b>+</b>${grp(b)}<b>=</b><span>❓</span></span>`,
    speech: `${a} plus ${b}, ça fait combien ? Compte les ${thing.q} et touche le bon chiffre !`,
    sum,
    options: shuffle([...opts]).map((n, i) => ({ html: `<span style="color:${pal[i % pal.length]}">${n}</span>`, correct: n === sum }))
  };
}

  cote:   { label: "à côté de",   a: null,     b: null },
  gauche: { label: "à gauche de", a: [22, 54], b: [70, 54] },
  droite: { label: "à droite de", a: [78, 54], b: [30, 54] }
};
function whereSVG(key, animal) {
  let p = WHERE_POS[key];
  if (key === "cote") p = WHERE_POS[rand(["gauche", "droite"])];
  const t = (xy, e, fs) => `<text x="${xy[0]}" y="${xy[1]}" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${e}</text>`;
  return `<svg viewBox="0 0 100 100">${t(p.b, "📦", 46)}${t(p.a, animal.e, 38)}</svg>`;
}
function buildWhere() {
  const animal = rand(ANIMALS);
  const keys = lv() >= 2 ? ["sur", "sous", "gauche", "droite"] : ["sur", "sous", "cote"];
  const target = rand(keys);
  const label = WHERE_POS[target].label;
  const cap = animal.art.charAt(0).toUpperCase() + animal.art.slice(1);
  return {
    text: `${cap} est ${label} la boîte`,
    visual: (target === "gauche" || target === "droite") ? "⬅️ gauche · droite ➡️" : "",
    speech: `Trouve l'image où ${animal.art} est ${label} la boîte. Touche dessus !`,
    target,
    options: shuffle(keys).map(k => ({ html: whereSVG(k, animal), correct: k === target, key: k }))
  };
}

/* --- Labyrinthe : guider la souris jusqu'au fromage --- */
ARENA.maze = function () {
  const f = $("field");
  let round = 0;
  $("stars3").textContent = "☆☆☆";
  const play = () => {
    f.innerHTML = "";
    setArena("Emmène la souris jusqu'au fromage !", "Emmène la petite souris jusqu'au fromage ! Glisse ton doigt dans les couloirs, sans traverser les murs.");
    const W = f.clientWidth, H = f.clientHeight, portrait = H > W;
    const n = Math.min(7, 4 + round + BOOST);
    const R = portrait ? n + 2 : n, C = portrait ? n : n + 2;
    const cell = Math.floor(Math.min((W - 30) / C, (H - 30) / R));
    // génération (parcours en profondeur)
    const open = Array.from({ length: R }, () => Array.from({ length: C }, () => ({ t: false, b: false, l: false, r: false })));
    const seen = Array.from({ length: R }, () => Array(C).fill(false));
    const stack = [[0, 0]]; seen[0][0] = true;
    const DIRS = [[-1, 0, "t", "b"], [1, 0, "b", "t"], [0, -1, "l", "r"], [0, 1, "r", "l"]];
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const nb = shuffle(DIRS).filter(([dr, dc]) => { const rr = r + dr, cc = c + dc; return rr >= 0 && rr < R && cc >= 0 && cc < C && !seen[rr][cc]; });
      if (!nb.length) { stack.pop(); continue; }
      const [dr, dc, a, b] = nb[0], rr = r + dr, cc = c + dc;
      open[r][c][a] = true; open[rr][cc][b] = true; seen[rr][cc] = true; stack.push([rr, cc]);
    }
    const maze = document.createElement("div");
    maze.className = "maze";
    const left = Math.round((W - C * cell) / 2) - 6, top = Math.round((H - R * cell) / 2) - 6;
    maze.style.cssText = `left:${left}px;top:${top}px;width:${C * cell}px;height:${R * cell}px`;
    const cells = [];
    const wall = "5px solid #5d4037";
    for (let r = 0; r < R; r++) {
      cells.push([]);
      for (let c = 0; c < C; c++) {
        const d = document.createElement("div");
        d.className = "mz";
        d.style.cssText = `left:${c * cell}px;top:${r * cell}px;width:${cell}px;height:${cell}px;` +
          (r > 0 && !open[r][c].t ? `border-top:${wall};` : "") + (c > 0 && !open[r][c].l ? `border-left:${wall};` : "");
        maze.appendChild(d); cells[r].push(d);
      }
    }
    const tok = (e) => { const t = document.createElement("div"); t.className = "mz-tok"; t.textContent = e;
      t.style.cssText = `width:${cell}px;height:${cell}px;font-size:${cell * 0.72}px`; maze.appendChild(t); return t; };
    const goal = tok("🧀"); goal.style.left = (C - 1) * cell + "px"; goal.style.top = (R - 1) * cell + "px";
    const mouse = tok("🐭");
    f.appendChild(maze);
    let pos = [0, 0], done = false, armed = false;
    const place = () => { mouse.style.left = pos[1] * cell + "px"; mouse.style.top = pos[0] * cell + "px"; cells[pos[0]][pos[1]].classList.add("trail"); };
    place();
    const canGo = (r, c, dr, dc) => {
      const k = dr === -1 ? "t" : dr === 1 ? "b" : dc === -1 ? "l" : "r";
      return open[r][c][k];
    };
    const move = e => {
      if (done) return;
      const rect = maze.getBoundingClientRect();
      const x = e.clientX - rect.left - 6, y = e.clientY - rect.top - 6;
      if (x < 0 || y < 0 || x >= C * cell || y >= R * cell) return;
      const tr = Math.floor(y / cell), tc = Math.floor(x / cell);
      const dist = Math.abs(tr - pos[0]) + Math.abs(tc - pos[1]);
      // on prend la souris en passant dessus (au doigt : en posant le doigt dessus)
      if (!armed) {
        if (dist <= 1 && (e.type === "pointerdown" || e.pointerType !== "touch")) armed = true;
        else return;
      }
      if (dist > 3) return;
      let guard = 0, moved = false;
      while ((pos[0] !== tr || pos[1] !== tc) && guard++ < 20) {
        const [r, c] = pos;
        const steps = [[Math.sign(tr - r), 0], [0, Math.sign(tc - c)]].filter(([dr, dc]) => (dr || dc) && canGo(r, c, dr, dc));
        if (!steps.length) break;
        const [dr, dc] = steps[0];
        pos = [r + dr, c + dc]; moved = true; place();
      }
      if (moved) tone(420 + (pos[0] + pos[1]) * 25, 0.06, "triangle", 0, 0.08);
      if (pos[0] === R - 1 && pos[1] === C - 1) {
        done = true; round++;
        $("stars3").textContent = "⭐".repeat(round) + "☆".repeat(3 - round);
        sound.win(); confetti(50); say(rand(["Miam ! Bravo", "Super", "Génial"]) + nm() + " !");
        later(() => round >= 3 ? finish() : play(), 1800);
      }
    };
    f.onpointermove = move; f.onpointerdown = move;
  };
  play();
};

/* --- J'écris : son prénom et des petits mots --- */
const WORDS = [
  { w: "CHAT", e: "🐱" }, { w: "LUNE", e: "🌙" }, { w: "LION", e: "🦁" }, { w: "PAPA", e: "👨" }, { w: "MAMAN", e: "👩" },
  { w: "POMME", e: "🍎" }, { w: "LAPIN", e: "🐰" }, { w: "TRAIN", e: "🚂" }, { w: "AVION", e: "✈️" }, { w: "ROBOT", e: "🤖" },
  { w: "BATEAU", e: "⛵" }, { w: "SOLEIL", e: "☀️" }, { w: "POULE", e: "🐔" }, { w: "FUSEE", e: "🚀" }
];
function nameWord() {
  return (PROFILE.name || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 10);
}
ARENA.word = function () {
  const f = $("field");
  let round = 0, lastW = "";
  $("stars3").textContent = "☆☆☆";
  const play = () => {
    f.innerHTML = "";
    const nw = nameWord();
    let item;
    if (round === 0 && nw.length >= 2) item = { w: nw, e: "🧒", isName: true };
    else {
      const maxLen = lv() >= 2 ? 6 : 5;
      item = rand(WORDS.filter(x => x.w.length <= maxLen && x.w !== lastW && (round > 0 || x.w.length <= 4 + BOOST)));
    }
    lastW = item.w;
    const word = item.w;
    if (item.isName) setArena("Écris ton prénom !", "Écris ton prénom ! Touche les lettres dans l'ordre.");
    else setArena("Écris le mot !", `Écris le mot ${word.toLowerCase()} ! Touche les lettres dans l'ordre.`);
    const W = f.clientWidth, H = f.clientHeight;
    const extra = lv() >= 2 ? 2 : 0;
    const pool = "ABCDEFGILMNOPRSTU".split("").filter(l => !word.includes(l));
    const letters = shuffle([...word.split(""), ...shuffle(pool).slice(0, extra)]);
    const slotSize = Math.floor(Math.min(H * 0.17, (W * 0.92) / word.length - 10, 110));
    const tileSize = Math.floor(Math.min(H * 0.2, (W * 0.94) / Math.min(letters.length, 7) - 14, 120));
    const wrap = document.createElement("div"); wrap.className = "word-wrap";
    wrap.innerHTML = `<div class="word-pic">${item.e}</div><div class="slots"></div><div class="tiles"></div>`;
    f.appendChild(wrap);
    const slots = word.split("").map(ch => {
      const d = document.createElement("div"); d.className = "wslot"; d.textContent = ch;
      d.style.cssText = `width:${slotSize}px;height:${slotSize}px;font-size:${slotSize * 0.62}px`;
      wrap.children[1].appendChild(d); return d;
    });
    let idx = 0;
    letters.forEach((ch, i) => {
      const t = document.createElement("button"); t.className = "tile"; t.textContent = ch;
      t.style.cssText = `width:${tileSize}px;height:${tileSize}px;font-size:${tileSize * 0.6}px;background:${LETTER_COLORS[i % LETTER_COLORS.length]}`;
      t.addEventListener("click", () => {
        if (idx >= word.length || t.classList.contains("used")) return;
        if (ch === word[idx]) {
          t.classList.add("used"); slots[idx].classList.add("filled"); idx++;
          tone(500 + idx * 50, 0.12, "triangle"); say(ch.toLowerCase());
          if (idx === word.length) {
            round++;
            $("stars3").textContent = "⭐".repeat(round) + "☆".repeat(3 - round);
            sound.win(); confetti(50);
            later(() => say(item.isName ? `Bravo ! Tu as écrit ton prénom, ${PROFILE.name} !` : `Bravo${nm()} ! Tu as écrit ${word.toLowerCase()} !`), 500);
            later(() => round >= 3 ? finish() : play(), 2600);
          }
        } else {
          t.classList.remove("bad"); void t.offsetWidth; t.classList.add("bad"); sound.oops();
        }
      });
      wrap.children[2].appendChild(t);
    });
  };
  play();
};
renderMenuInfo();

  ctx();
  if ("speechSynthesis" in window) { try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {} }
